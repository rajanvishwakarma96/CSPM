services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud_autopilot
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cloud -d cloud_autopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
      DATABASE_URL: postgresql+psycopg://cloud:${POSTGRES_PASSWORD:-cloud}@postgres:5432/cloud_autopilot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    command: ["celery","-A","worker.celery","worker","--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg://cloud:${POSTGRES_PASSWORD:-cloud}@postgres:5432/cloud_autopilot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
volumes:
  postgres_data:
