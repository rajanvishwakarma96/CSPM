services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ~/.aws:/root/.aws:ro
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
